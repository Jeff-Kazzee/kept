<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Appointment evidence intake (D1)</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 980px; margin: 1rem auto; padding: 0 1rem; line-height: 1.4; }
      section { border-top: 1px solid #ccc; padding: 0.5rem 0 1rem; }
      .card { border: 1px solid #ccc; padding: 0.5rem 0.75rem; margin: 0.5rem 0; }
      .label { font-size: 0.8rem; font-weight: 600; text-transform: uppercase; color: #444; }
      .model { background: #fff7e0; }
      .rejected { background: #fdeaea; }
      .error { color: #a00; }
      pre { white-space: pre-wrap; background: #f4f4f4; padding: 0.5rem; margin: 0.25rem 0; }
      label { display: block; margin: 0.25rem 0; }
      table { border-collapse: collapse; }
      td, th { border: 1px solid #ccc; padding: 0.2rem 0.5rem; text-align: left; }
      button { margin-right: 0.5rem; }
    </style>

    <div id="root"></div>
