<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Appointment change assistant</title>
    <link rel="icon" href="data:," />
    <style>
      body { font-family: system-ui, sans-serif; max-width: 980px; margin: 1rem auto; padding: 0 1rem; line-height: 1.4; }
      section { border-top: 1px solid #ccc; padding: 0.5rem 0 1rem; }
      .card { border: 1px solid #ccc; padding: 0.5rem 0.75rem; margin: 0.5rem 0; }
      .label { font-size: 0.8rem; font-weight: 600; text-transform: uppercase; color: #444; }
      .model { background: #fff7e0; }
      .rejected { background: #fdeaea; }
      .error { color: #a00; }
      pre { white-space: pre-wrap; background: #f4f4f4; padding: 0.5rem; margin: 0.25rem 0; }
      label { display: block; margin: 0.25rem 0; }
      table { border-collapse: collapse; }
      td, th { border: 1px solid #ccc; padding: 0.2rem 0.5rem; text-align: left; }
      button { margin: 0.25rem 0.5rem 0.25rem 0; }
      .warn { color: #8a4b00; font-weight: 600; }
      .split { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
      .sources { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
      .source { margin: 0; }
      .source .label { text-transform: none; }
      .nowrap { white-space: nowrap; }
      .cited { font-size: 0.9rem; color: #444; margin: 0.25rem 0; }
      .notice { background: #eef4ff; border: 1px solid #9bb7e0; padding: 0.5rem 0.75rem; }
      .sent { background: #eefbea; }
      .simulated { font-weight: 700; color: #1f5f1a; }
      textarea { max-width: 100%; }
      .danger { border-color: #a00; background: #fff5f5; }
      .danger button { color: #a00; font-weight: 700; }
      .quote { font-size: 0.9rem; color: #333; }
      .undone { text-decoration: line-through; color: #666; }
      .agent { background: #f3f0ff; }
      .untrusted { border: 1px dashed #8a6d00; background: #fffdf2; padding: 0.25rem 0.5rem; margin: 0.25rem 0; }
      .untrusted .label { text-transform: none; color: #6b5500; }
      .token { border-color: #8a4b00; background: #fff8ec; }
      .secret { display: block; font-size: 1rem; padding: 0.5rem; background: #fff; border: 1px solid #ccc; overflow-wrap: anywhere; }
      tr.archived td { color: #666; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
